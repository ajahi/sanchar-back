services:
  api:
    build: .
    container_name: nepsocial-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nepsocial}:${POSTGRES_PASSWORD:-nepsocial}@postgres:5432/${POSTGRES_DB:-nepsocial}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nepsocial}:${RABBITMQ_PASSWORD:-nepsocial}@rabbitmq:5672/
      # 4 uvicorn processes x (8 + 4) = 48 DB connections; with the worker's 15, well under Postgres' 100
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nepsocial

  # Sends the auto-replies the api queues. Scale with `docker compose up -d --scale worker=N`.
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DB_POOL_PRE_PING: "false"  # a dead pooled connection only fails one job, which the queue retries
      DB_POOL_SIZE: "10"  # 15 connections per worker; a job lets go of its connection while it waits on the model
      DB_MAX_OVERFLOW: "5"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nepsocial}:${POSTGRES_PASSWORD:-nepsocial}@postgres:5432/${POSTGRES_DB:-nepsocial}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nepsocial}:${RABBITMQ_PASSWORD:-nepsocial}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nepsocial

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nepsocial-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nepsocial}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nepsocial}
    ports:
      - "5672:5672"    # AMQP, for an app or worker run on the host (RABBITMQ_URL=amqp://...@localhost:5672/)
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # gosu: a root healthcheck that runs before the server has made its erlang cookie leaves it root-owned and the broker dies
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - nepsocial

  postgres:
    image: postgres:16
    container_name: nepsocial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nepsocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nepsocial}
      POSTGRES_DB: ${POSTGRES_DB:-nepsocial}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepsocial} -d ${POSTGRES_DB:-nepsocial}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nepsocial
  
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    restart: always
    ports:
      - "8085:8080"
    networks:
      - nepsocial

volumes:
  postgres_data:
  rabbitmq_data:

# Named so the frontend compose (next-app) can join it as `external`.
networks:
  nepsocial:
  
