name: deploy-backend

# Runs on the VPS itself (self-hosted runner with the label "sanchar"): pulls tst/auto-reply into
# the compose directory and rebuilds the api container. The runner's own checkout is not used.
on:
  push:
    branches: [tst/auto-reply]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false  # let a running deploy finish; the next push queues behind it

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test  # a red test run stops the deploy
    runs-on: [self-hosted, sanchar]
    timeout-minutes: 15
    env:
      APP_DIR: /home/ajahi/sanchar-back
      BRANCH: tst/auto-reply
    steps:
      - name: Pull the branch
        run: |
          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git log --oneline -1

      - name: Build the api and worker images
        run: |
          cd "$APP_DIR"
          docker compose build api worker  # same Dockerfile; the worker sends the replies the api queues

      # Before the new code goes live: code reading a column its migration hasn't created takes the whole api down.
      - name: Run database migrations
        run: |
          cd "$APP_DIR"
          docker compose run --rm --no-deps api alembic upgrade head

      # funnels/*.md -> the live funnel versions (a changed file becomes a new version; a bad one stops the deploy).
      - name: Make the funnel .md files live
        run: |
          cd "$APP_DIR"
          docker compose run --rm --no-deps api python -m scripts.sync_funnels

      - name: Restart the api and worker containers
        run: |
          cd "$APP_DIR"
          docker compose up -d api worker  # also starts rabbitmq (api and worker depend on it)
          docker image prune -f  # the previous build is left untagged on every deploy

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8005/health; then echo; exit 0; fi
            sleep 3
          done
          echo "api did not become healthy"; docker logs --tail 50 nepsocial-api; exit 1
